[package]
name = "clck"
version = "0.1.4"
edition = "2021"
publish = false

[lib]
name = "main"
crate-type = ["cdylib", "rlib"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "0.10"

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", features = ["native-activity"] }
android-properties = "0.2"
glow = "0.16"
jni = "0.22"
fontdue = { version = "0.9", default-features = false, features = ["std", "simd", "hashbrown"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
